<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公司每日打卡與工作回報</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            max-width: 600px; 
            margin: 20px auto; 
            padding: 15px; 
            background: #f4f7f6; 
        }
        .card { 
            background: white; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.08); 
        }
        h2 {
            margin-top: 0;
            color: #333;
            font-size: 22px;
            text-align: center;
        }
        .form-group { 
            margin-bottom: 20px; 
        }
        label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: bold; 
            color: #444;
        }
        input[type="text"], textarea { 
            width: 100%; 
            padding: 12px; 
            box-sizing: border-box; 
            border: 1px solid #ddd; 
            border-radius: 6px; 
            font-size: 16px; 
        }
        textarea {
            resize: vertical;
        }
        button { 
            background: #007bff; 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 16px; 
            width: 100%;
        }
        button:hover { 
            background: #0056b3; 
        }
        .loc-btn {
            background: #28a745;
            margin-bottom: 8px;
        }
        .loc-btn:hover {
            background: #218838;
        }
        #locationText { 
            font-size: 14px; 
            color: #666; 
            margin-top: 5px; 
            background: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
            border: 1px dashed #ccc;
            word-break: break-all;
        }
        #status { 
            margin-top: 15px; 
            color: #28a745; 
            font-weight: bold; 
            text-align: center; 
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🚀 每日打卡與工作回報</h2>
    <form id="checkinForm">
        <div class="form-group">
            <label for="empName">員工姓名：</label>
            <input type="text" id="empName" required placeholder="請輸入您的姓名">
        </div>

        <div class="form-group">
            <label>打卡位置：</label>
            <button type="button" class="loc-btn" onclick="getLocation()">📍 取得目前位置並打卡</button>
            <div id="locationText">尚未取得位置</div>
        </div>

        <div class="form-group">
            <label for="workSummary">今日工作簡述：</label>
            <textarea id="workSummary" rows="4" required placeholder="簡單描述今天做了什麼、進度如何..."></textarea>
        </div>

        <button type="submit">送出今日紀錄</button>
        <p id="status"></p>
    </form>
</div>

<script>
    let currentCoords = "";
    let currentAddress = "";

    // 取得地理位置並透過免費 API 轉為中文地址
    function getLocation() {
        const locText = document.getElementById("locationText");
        if (navigator.geolocation) {
            locText.innerText = "正在取得 GPS 定位中，請稍候...";
            
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    currentCoords = `緯度: ${lat.toFixed(4)}, 經度: ${lon.toFixed(4)}`;
                    
                    locText.innerText = "定位成功，正在轉換為中文地址...";

                    // 使用 OpenStreetMap Nominatim API 進行反向地理編碼
                    fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=zh-TW`)
                        .then(response => response.json())
                        .then(data => {
                            if (data && data.display_name) {
                                currentAddress = data.display_name;
                                locText.innerText = `📍 打卡地址：${currentAddress}`;
                            } else {
                                locText.innerText = `📍 座標：${currentCoords} (無法解析詳細地址)`;
                            }
                        })
                        .catch(err => {
                            locText.innerText = `📍 座標：${currentCoords} (地址轉換連線失敗)`;
                        });
                },
                (error) => {
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            locText.innerText = "❌ 失敗：您拒絕了定位權限，請至瀏覽器設定開啟。";
                            break;
                        case error.POSITION_UNAVAILABLE:
                            locText.innerText = "❌ 失敗：找不到 GPS 訊號，請確認手機定位已開啟。";
                            break;
                        case error.TIMEOUT:
                            locText.innerText = "❌ 失敗：取得位置逾時，請再試一次。";
                            break;
                        default:
                            locText.innerText = "❌ 失敗：發生未知錯誤。";
                            break;
                    }
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        } else {
            locText.innerText = "❌ 您的瀏覽器不支援地理定位功能。";
        }
    }

    // 表單送出事件
    document.getElementById("checkinForm").addEventListener("submit", function(e) {
        e.preventDefault();
        
        const name = document.getElementById("empName").value;
        const summary = document.getElementById("workSummary").value;
        const nowTime = new Date().toLocaleString();

        if (!currentAddress && !currentCoords) {
            alert("請先點擊「取得目前位置並打卡」取得定位後再送出！");
            return;
        }

        const payload = {
            name: name,
            time: nowTime,
            location: currentAddress || currentCoords,
            summary: summary
        };

        // 之後可以把 payload 透過 fetch() 傳送到您的 Google Apps Script 後端
        console.log("準備送出的資料：", payload);
        
        document.getElementById("status").innerText = "🎉 送出成功！感謝您的回報。";
        document.getElementById("checkinForm").reset();
        document.getElementById("locationText").innerText = "尚未取得位置";
        currentAddress = "";
        currentCoords = "";
    });
</script>

</body>
</html>
